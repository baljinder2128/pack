# Builds an installable Android APK on GitHub (no Expo account needed) and
# publishes it as a pre-release so it can be downloaded straight to a phone.
name: Android APK

on:
  push:
    branches: [main, claude/project-thread-cw23rh]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm test
          npm run test:db

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/release/app-release.apk sbt-trucking.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" sbt-trucking.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "SBT Trucking Android test build (${GITHUB_REF_NAME})" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your Android phone and tap sbt-trucking.apk to install."
