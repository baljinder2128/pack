# Every 15 minutes, asks the licence-alerts edge function to take anyone who has been
# on duty for over 14 hours off duty, log their hours and email the office and the
# driver about the breach.
name: Duty check
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Take drivers over 14 hours off duty
        run: |
          # The publishable key is public (it's in the app); the gateway wants one on every call.
          curl -s -w "\nHTTP %{http_code}\n" -X POST -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_ycu7wSo6tIKgqQ_Vs44m9A_LL7G1weP" -d '{"duty_check":true}' \
            https://kovvxlnoezlzzlbavtez.supabase.co/functions/v1/licence-alerts
