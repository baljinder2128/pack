# Every morning, asks the licence-alerts edge function to email the office about
# any driver licence that expires within a week (each licence is emailed once).
name: Licence alerts
on:
  schedule:
    - cron: '7 21 * * *' # about 8am in Sydney
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Run the licence check
        run: |
          # The publishable key is public (it's in the app); the gateway wants one on every call.
          curl -s -w "\nHTTP %{http_code}\n" -X POST -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_ycu7wSo6tIKgqQ_Vs44m9A_LL7G1weP" -d '{}' \
            https://kovvxlnoezlzzlbavtez.supabase.co/functions/v1/licence-alerts
